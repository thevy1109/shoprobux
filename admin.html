<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REMROBUX Admin</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body class="admin-body"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">R</span> REMROBUX <small>ADMIN</small></a><a class="btn btn-ghost" href="index.html">← Cửa hàng</a></header><main class="admin-main"><div class="section-head"><div><div class="eyebrow">CONTROL CENTER</div><h1>Quản trị <span>cửa hàng</span></h1></div><button id="admin-login" class="btn btn-primary">Đăng nhập Admin</button></div><div id="admin-content" class="hidden"><div class="admin-tabs"><button class="tab active" data-tab="deposits">Yêu cầu nạp</button><button class="tab" data-tab="products">Sản phẩm</button><button class="tab" data-tab="orders">Đơn hàng</button></div><section id="tab-deposits" class="panel"><h2>Yêu cầu nạp tiền</h2><div id="deposit-list">Đang tải...</div></section><section id="tab-products" class="panel hidden"><h2>Thêm sản phẩm</h2><form id="product-form" class="admin-form"><label>Tên sản phẩm<input id="p-name" required></label><label>Loại<select id="p-type"><option value="robux">Robux</option><option value="account">Acc Roblox</option></select></label><label>Giá (VNĐ)<input id="p-price" type="number" min="1000" required></label><label>Số lượng<input id="p-stock" type="number" min="0" value="1" required></label><label class="wide">Mô tả<textarea id="p-desc"></textarea></label><label class="wide">Thông tin giao hàng (chỉ hiện sau khi mua; không nhập mật khẩu email cá nhân)<textarea id="p-delivery"></textarea></label><button class="btn btn-primary">Thêm sản phẩm</button></form><div id="product-list"></div></section><section id="tab-orders" class="panel hidden"><h2>Đơn hàng</h2><div id="order-list">Đang tải...</div></section></div><p id="admin-note" class="muted">Đăng nhập bằng tài khoản đã được cấp quyền admin trong database.</p></main><div id="toast" class="toast"></div><script src="admin.js"></script></body></html>
