<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Nạp Robux & Kim Cương</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff6600;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #b0b0b0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #ff6600;
            outline: none;
        }
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .package-card {
            background: #2a2a2a;
            border: 2px solid #333;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .package-card.selected {
            border-color: #ff6600;
            background: rgba(255, 102, 0, 0.1);
        }
        .package-card h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }
        .package-card p {
            color: #ff6600;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #ff6600;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-submit:hover {
            background: #e55c00;
        }
        .notification {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
        }
        .notification.success {
            background: rgba(72, 187, 120, 0.2);
            color: #48bb78;
            border: 1px solid #48bb78;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>NẠP ROBUX TỰ ĐỘNG</h2>
    
    <div class="form-group">
        <label for="username">Tên tài khoản / ID Roblox</label>
        <input type="text" id="username" placeholder="Nhập username của bạn...">
    </div>

    <div class="form-group">
        <label>Chọn gói nạp</label>
        <div class="packages-grid">
            <div class="package-card selected" onclick="selectPackage(this, '400 Robux', '50.000đ')">
                <h4>400 Robux</h4>
                <p>50.000đ</p>
            </div>
            <div class="package-card" onclick="selectPackage(this, '800 Robux', '100.000đ')">
                <h4>800 Robux</h4>
                <p>100.000đ</p>
            </div>
            <div class="package-card" onclick="selectPackage(this, '1700 Robux', '200.000đ')">
                <h4>1700 Robux</h4>
                <p>200.000đ</p>
            </div>
            <div class="package-card" onclick="selectPackage(this, '4500 Robux', '500.000đ')">
                <h4>4500 Robux</h4>
                <p>500.000đ</p>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="payment">Phương thức thanh toán</label>
        <select id="payment">
            <option value="momo">Ví MoMo</option>
            <option value="zalopay">Ví ZaloPay</option>
            <option value="vietqr">Chuyển khoản Ngân hàng (VietQR)</option>
            <option value="card">Thẻ cào điện thoại</option>
        </select>
    </div>

    <button class="btn-submit" onclick="handleSubmit()">THANH TOÁN NGAY</button>

    <div id="msg" class="notification"></div>
</div>

<script>
    let selectedPackageName = "400 Robux";
    let selectedPrice = "50.000đ";

    function selectPackage(element, name, price) {
        // Bỏ chọn tất cả các card khác
        document.querySelectorAll('.package-card').forEach(card => {
            card.classList.remove('selected');
        });
        // Đánh dấu card hiện tại được chọn
        element.classList.add('selected');
        selectedPackageName = name;
        selectedPrice = price;
    }

    function handleSubmit() {
        const username = document.getElementById('username').value.trim();
        const paymentMethod = document.getElementById('payment').value;
        const msgDiv = document.getElementById('msg');

        if (!username) {
            alert("Vui lòng nhập tên tài khoản hoặc ID Roblox!");
            document.getElementById('username').focus();
            return;
        }

        // Hiệu ứng thông báo thành công (hoặc bạn có thể thay bằng hàm gửi API Telegram ở đây)
        msgDiv.style.display = 'block';
        msgDiv.className = 'notification success';
        msgDiv.innerHTML = `Đã tạo đơn hàng cho tài khoản <b>${username}</b> với gói <b>${selectedPackageName} (${selectedPrice})</b> thành công! Đang chuyển hướng thanh toán...`;

        // Nếu bạn muốn tích hợp gửi thông báo qua Bot Telegram đã cấu hình trước đó, có thể gọi fetch() API ở đây.
    }
</script>

</body>
</html>
